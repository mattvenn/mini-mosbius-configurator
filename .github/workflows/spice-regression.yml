name: Spice Regression

# **Temporarily on every push, while the examples are still being
# developed (2026-08-29).** The steady state for this workflow is the
# monthly canary below: the decks rarely change, and most of each job is
# ngspice parsing sky130A's model library rather than simulating anything
# (see CLAUDE.md). It is on push for now because they are changing daily
# and a break is worth hearing about the same day -- the six jobs run in
# parallel, so that costs about five minutes of waiting. TODO.md carries
# the item to put it back.
on:
  push:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  # A separate job per example, not another step, so they fail
  # independently: each guards something the others cannot, so a break in
  # one is not evidence about the rest, and a report saying which broke is
  # worth more than one that stops at the first. The inverter is
  # pad-and-load dominated; the ring is switch-matrix dominated (row
  # coupling and bus-wire capacitance are what set its frequency); the diff
  # amp is the only one that would notice a shifted bias point, since it is
  # the only analog operating point here rather than a digital edge; the
  # SR latch is the only one that stores a value, so it is the only one that
  # would notice the routed matrix losing a held state; the OTA follower is
  # the only one that uses mosbius_ota at all and the only one that closes a
  # feedback loop through the matrix; and the current source is the only one
  # that measures a current, so it is the only one that would notice the
  # chip's single bias reference being split, shorted or absent.
  inverter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simulate examples/inverter in IIC-OSIC-TOOLS
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work hpretl/iic-osic-tools:latest \
            --skip bash -lc 'sh tools/check_inverter_sim.sh'

      - name: Upload ngspice log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverter-ngspice-log
          path: build/ngspice_tb_inverter.log
          if-no-files-found: ignore

  ringosc:
    runs-on: ubuntu-latest
    steps:
