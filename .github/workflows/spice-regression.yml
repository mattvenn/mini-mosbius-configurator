name: Spice Regression

# **On every push, and that is the steady state (decided 2026-08-31).**
# This was a monthly cron with push as a temporary measure while the
# examples were being developed; the cron is gone. Most of each job is
# ngspice parsing sky130A's model library rather than simulating anything
# (see CLAUDE.md), so it is not cheap -- but the seven jobs run in
# parallel, so it costs about five minutes of waiting, and it is the only
# thing in the repo that exercises the whole schematic -> netlist -> route
# -> simulate path on a real design. A month was long enough for a broken
# example to be discovered by someone at a bench rather than by CI.
on:
  push:
  workflow_dispatch:

jobs:
  # One matrix leg per example, not one job with seven steps, so they fail
  # independently: each guards something the others cannot, so a break in
  # one is not evidence about the rest, and a report saying which broke is
  # worth more than one that stops at the first. A matrix keeps that -- each
  # leg is its own named job with its own red X -- while collapsing seven
  # near-identical job blocks that differed only in the example's name.
  #
  # What each leg guards: the inverter is pad-and-load dominated; the ring is
  # switch-matrix dominated (row coupling and bus-wire capacitance are what
  # set its frequency); the diff amp is the only one that would notice a
  # shifted bias point on the NMOS side, since it is an analog operating
  # point rather than a digital edge, and the PMOS diff amp is its mirror --
  # the only leg that exercises the PMOS tail bank, so a device-library
  # change that got the PMOS side wrong would leave the NMOS one passing;
  # the SR latch is the only one that stores a value, so it is the only one
  # that would notice the routed matrix losing a held state; the OTA
  # follower is the only one that uses mosbius_ota at all and the only one
  # that closes a feedback loop through the matrix; and the current source
  # is the only one that measures a current, so it is the only one that
  # would notice the chip's single bias reference being split, shorted or
  # absent.
  simulate:
    runs-on: ubuntu-latest
    strategy:
      # One leg failing must not cancel the others: which of them broke is
      # the information this workflow exists to produce.
      fail-fast: false
      matrix:
        # `example` is what tools/sim/check_example_sim.sh takes; `deck` is the
        # testbench name the ngspice log is written under, which differs
        # only for the ring (examples/ringosc/ draws ring.sch).
        include:
          - example: inverter
            deck: inverter
          - example: ring
            deck: ring
          - example: diffamp
            deck: diffamp
          - example: pdiffamp
            deck: pdiffamp
          - example: srlatch
            deck: srlatch
          - example: otabuf
            deck: otabuf
          - example: currentsource
            deck: currentsource
    name: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - name: Simulate examples/${{ matrix.example }} in IIC-OSIC-TOOLS
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work hpretl/iic-osic-tools:2026.05 \
            --skip bash -lc 'sh tools/sim/check_example_sim.sh ${{ matrix.example }}'

      - name: Upload ngspice log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-ngspice-log
          path: build/ngspice_tb_${{ matrix.deck }}.log
          if-no-files-found: ignore
